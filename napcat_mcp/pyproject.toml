[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omniqq-mcp"
version = "1.1.0"
description = "NapCat OneBot 11 MCP server with 74 tools, account-isolated events and concurrent requests"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = [
    "omniqq",
    "omniqq-mcp",
    "mcp",
    "model-context-protocol",
    "mcp-server",
    "napcat",
    "napcatqq",
    "onebot",
    "onebot11",
    "qq-bot",
    "ntqq",
    "ai-agent",
    "claude-desktop",
    "cursor",
    "antigravity"
]
dependencies = [
    "aiohttp>=3.8.0",
    "websockets>=14.0,<17",
    "psutil>=5.9.0"
]

[project.scripts]
omniqq-mcp = "napcat_mcp.run_mcp:main"

[tool.setuptools]
packages = ["napcat_mcp", "napcat_mcp.tools"]
package-dir = {napcat_mcp = "."}
