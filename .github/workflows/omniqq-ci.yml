name: OmniQQ MCP

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install checks
        run: |
          python -m pip install -U build flake8 mypy pip-audit
          python -m pip install -e .
          python -m pip install -r requirements.txt
      - name: Syntax and lint
        run: |
          python -m compileall -q napcat_mcp
          python -m flake8 napcat_mcp --select E4,E7,E9,F --exclude build,__pycache__
      - name: Type check core contracts
        run: python -m mypy --follow-imports=silent --ignore-missing-imports napcat_mcp/tools/__init__.py napcat_mcp/audit.py
      - name: Test
        run: python -X utf8 -m unittest discover -s tests -q
      - name: Dependency audit
        run: python -m pip_audit -r requirements.txt
      - name: Build wheel
        run: python -m build --outdir dist .
      - name: Clean wheel smoke test
        shell: pwsh
        run: |
          python -m venv "$env:RUNNER_TEMP\omniqq-smoke"
          $wheel = (Get-ChildItem dist\*.whl | Select-Object -First 1).FullName
          & "$env:RUNNER_TEMP\omniqq-smoke\Scripts\python.exe" -m pip install $wheel
          Push-Location $env:RUNNER_TEMP
          & "$env:RUNNER_TEMP\omniqq-smoke\Scripts\python.exe" -c "from napcat_mcp.server import NapCatMCPServer; s=NapCatMCPServer(); assert len(s.registry.list_tools()) == 74"
          Pop-Location
      - uses: actions/upload-artifact@v4
        with:
          name: omniqq-mcp-python-${{ matrix.python-version }}
          path: dist/*
