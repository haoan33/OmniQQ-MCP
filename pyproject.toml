[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omniqq-mcp"
version = "1.0.0"
description = "OmniQQ-MCP: Full-Featured NapCatQQ (OneBot 11) Model Context Protocol (MCP) Server with QR Login, Multi-Account Hot-Switch, Auto-Deploy & 144+ Actions"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = [
    "omniqq",
    "omniqq-mcp",
    "mcp",
    "model-context-protocol",
    "mcp-server",
    "napcat",
    "napcatqq",
    "onebot",
    "onebot11",
    "qq-bot",
    "ntqq",
    "ai-agent",
    "claude-desktop",
    "cursor",
    "antigravity"
]
dependencies = [
    "aiohttp>=3.8.0",
    "websockets>=11.0.0",
    "psutil>=5.9.0"
]

[project.scripts]
omniqq-mcp = "napcat_mcp.run_mcp:main"
